project:
  type: website
  output-dir: _site

website:
  title: "CanvasXpress in R"
  description: "Interactive, reproducible scientific visualization in R with canvasXpress."
  site-url: "https://neuhausi.github.io/canvasxpress-blog"
  navbar:
    right:
      - text: "All posts"
        href: index.qmd
      - text: "R"
        href: r.qmd
      - text: "Python"
        href: python.qmd
      - about.qmd
      - icon: github
        href: https://github.com/neuhausi/canvasXpress
      - icon: rss
        href: r.xml
  page-footer:
    center:
      - text: "Syndicated on R-bloggers"
        href: https://www.r-bloggers.com
      - text: "About"
        href: about.qmd
      - text: "canvasXpress"
        href: https://canvasxpress.org

format:
  html:
    theme: cosmo
    toc: true
    css: styles.css

execute:
  freeze: auto
